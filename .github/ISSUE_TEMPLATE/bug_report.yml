name: Bug report
description: Report a reproducible problem in starter.
title: '[bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve starter.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest reproducible steps and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, operating system, and relevant package versions.
    validations:
      required: true
