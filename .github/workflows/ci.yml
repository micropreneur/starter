name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vulnerabilities fail the job; an unreachable npm audit endpoint only warns.
      - name: Audit production dependencies
        timeout-minutes: 6
        run: |
          set +e
          pnpm audit:prod 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -Eq '^\s*(ERR_SOCKET_TIMEOUT|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|ERR_PNPM_AUDIT_BAD_RESPONSE)\b' audit.log; then
            echo "::warning title=pnpm audit skipped::npm audit endpoint unreachable; dependency audit did not run."
            exit 0
          fi
          exit "$status"
      - run: pnpm turbo typecheck lint build test
